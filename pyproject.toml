[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-boundary-monitor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["agentdojo==0.1.35", "pydantic>=2.7.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# AgentDojo's suite registry must initialize before importing banking models.
"src/tbm/cases.py" = ["I001"]
